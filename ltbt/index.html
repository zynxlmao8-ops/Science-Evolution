<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Let There Be Thought</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:Georgia,'Times New Roman',serif;color:#fff}
canvas{position:fixed;inset:0;display:block}
#flash{position:fixed;inset:0;background:#dff8ff;opacity:0;pointer-events:none}
#txt{position:fixed;left:0;right:0;bottom:11vh;text-align:center;pointer-events:none;padding:0 5vw}
h1{margin:0;font-weight:400;font-size:clamp(34px,7.4vw,104px);letter-spacing:.04em;line-height:1.05}
h1 span{display:inline-block;opacity:0;filter:blur(18px);transform:scale(1.6) translateY(10px);background:linear-gradient(180deg,#fff 30%,#8fe3ff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 40px #5fd0ff55}
h1 span.w{width:.3em}
.go h1 span{animation:in 1.1s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*60ms)}
@keyframes in{to{opacity:1;filter:blur(0);transform:none}}
p{margin:14px 0 0;font-size:clamp(13px,1.6vw,20px);letter-spacing:.32em;text-transform:uppercase;color:#9fdcf0;opacity:0;transition:opacity 1.6s 1.7s}

.go p,.go small{opacity:1}
#hint{position:fixed;top:18px;width:100%;text-align:center;font-size:12px;letter-spacing:.3em;color:#4d6b78;text-transform:uppercase;transition:opacity .6s}
</style></head><body>
<div id="hint">move your mouse · click to ignite</div><div id="flash"></div>
<div id="txt"><h1 id="h"></h1><p>One prompt. All the thinking.</p><small>Built by Claude from a single prompt · click to replay</small></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const $=s=>document.querySelector(s), txt=$('#txt');
[...'Let There Be Thought'].forEach((c,i)=>{const s=document.createElement('span');s.textContent=c===' '?' ':c;if(c===' ')s.className='w';s.style.setProperty('--i',i);$('#h').append(s)});
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.toneMapping=THREE.ACESFilmicToneMapping;document.body.prepend(R.domElement);

S.add(new THREE.HemisphereLight(0x6a7a9a,0x050505,.5));
const key=new THREE.DirectionalLight(0xffe6cc,1.2);key.position.set(-3,5,6);S.add(key);
const glowL=new THREE.PointLight(0x7fe3ff,0,14,1.6);S.add(glowL);
const MT={"L":{"w":1200,"h":440,"tx":1152,"ty":275,"oy":760},"R":{"w":1280,"h":440,"tx":31,"ty":200,"oy":760},"ref":997},TL=new THREE.TextureLoader(),WS=.0052,tex=(f,c)=>{const t=TL.load(f);if(c)t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t};

 const mesh=new THREE.Mesh(new THREE.PlaneGeometry(m.w*WS,m.h*WS),new THREE.MeshBasicMaterial({map,toneMapped:false,transparent:true,alphaTest:.02,depthWrite:false,side:THREE.DoubleSide}));

const E=new THREE.Group();S.add(E);
const core=new THREE.Mesh(new THREE.IcosahedronGeometry(.3,1),new THREE.MeshStandardMaterial({color:0xffffff,emissive:0x9ee9ff,emissiveIntensity:2.2,flatShading:true,roughness:.2}));

const rings=[0,1,2].map(i=>{const t=new THREE.Mesh(new THREE.TorusGeometry(.66+i*.1,.006,6,90),new THREE.MeshBasicMaterial({color:0xbff3ff}));t.rotation.set(i*1.05,i*.7,0);return t});

E.add(core,cage,halo,...rings);
const wave=new THREE.Mesh(new THREE.RingGeometry(.92,1,96),new THREE.MeshBasicMaterial({color:0xaeeeff,transparent:true,opacity:0,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,depthWrite:false}));S.add(wave);
const N=900,pp=new Float32Array(N*3),pv=new Float32Array(N*3),P=new THREE.Points(new THREE.BufferGeometry().setAttribute('position',new THREE.BufferAttribute(pp,3)),new THREE.PointsMaterial({color:0xcff6ff,size:.05,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));P.frustumCulled=false;S.add(P);
const st=new Float32Array(700*3).map((_,i)=>i%3==2?-6-Math.random()*20:(Math.random()-.5)*40);S.add(new THREE.Points(new THREE.BufferGeometry().setAttribute('position',new THREE.BufferAttribute(st,3)),new THREE.PointsMaterial({color:0x6a8aa0,size:.03})));
let t0=performance.now(),blown=-1,mx=0,my=0,pw=1;
addEventListener('pointermove',e=>{mx=e.clientX/innerWidth*2-1;my=e.clientY/innerHeight*2-1});

 for(let i=0;i<N;i++){const a=Math.random()*6.283,b=Math.acos(2*Math.random()-1),s=1.5+Math.random()*7;pp.set([0,0,0],i*3);pv.set([Math.sin(b)*Math.cos(a)*s,Math.sin(b)*Math.sin(a)*s,Math.cos(b)*s],i*3)}

addEventListener('pointerdown',()=>{if(blown<0)blow();else if(performance.now()-blown>4500)reset()});
const ease=x=>1-Math.pow(1-Math.min(1,Math.max(0,x)),3);let last=performance.now();
R.setAnimationLoop(()=>{const n=performance.now(),dt=Math.min(.05,(n-last)/1e3);last=n;const t=(n-t0)/1e3,b=blown<0?-1:(n-blown)/1e3;

  C.position.x+=(Math.random()-.5)*.08*Math.exp(-b*3)}

 rings.forEach((r,i)=>{r.rotation.z+=dt*(.6+i*.5);r.rotation.x+=dt*.3});cage.rotation.y-=dt*.4;
 A.rotation.y+=(mx*.3-A.rotation.y)*dt*4;G.rotation.y+=(mx*.3-G.rotation.y)*dt*4;A.rotation.x=G.rotation.x+=(my*.2-G.rotation.x)*dt*4;
 C.position.x+=(mx*.9-C.position.x)*Math.min(1,dt*3);C.position.y+=(-1.0-my*.5-C.position.y)*Math.min(1,dt*3);C.lookAt(0,-1.0,0);
